[project]
name = "mcp-apps-chat-backend"
version = "0.1.0"
description = "PoC backend: MCP client + agent loop + WebSocket gateway for an Angular MCP-Apps chat UI"
requires-python = ">=3.10"
dependencies = [
    "mcp==1.27.2",
    "mcp-ui-server==1.0.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.109",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
